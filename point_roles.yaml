  # -------------------------------------------------------------------- staging
  # Haystack prototype: {stage:1 heat run cmd point}. The stage number is
  # exported as the Haystack "stage" value tag.
  - id: HTG-STG-C
    name: heating_stage_cmd
    requires: {mode: heating, subject: stage, function: cmd}
    units_family: null
    bacnet_types: [BO, BV]
    equip_types: [rtu, ahu, fcu, unit_heater]
    stage: true
    canonical: "HTG-STG{n}-C"
    haystack: [heat, run, cmd]
    brick: Heating_Command
    kind: Bool

  - id: CLG-STG-C
    name: cooling_stage_cmd
    requires: {mode: cooling, subject: stage, function: cmd}
    units_family: null
    bacnet_types: [BO, BV]
    equip_types: [rtu, ahu]
